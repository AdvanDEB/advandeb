[pytest]
# Repo-level tests only. Each component is its own pytest root with its own
# config and is run from its own directory:
#
#   pytest                                  # repo root: tests/ (this file)
#   cd app/backend && pytest                # app/backend/pytest.ini
#   cd knowledge-builder && pytest          # [tool.pytest.ini_options] in pyproject.toml
#
# They cannot share one session: app/backend/tests and knowledge-builder/tests
# are both packages named "tests", and --import-mode=importlib (which avoided
# that clash) names modules from the repo root and shadows the real `app`
# package ("'app' is not a package").
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

# tests/integration/ exercises the live services on this host (gateway, agents,
# backend, ArangoDB) and must never run in CI. It is skipped when recursing;
# run it explicitly with `pytest tests/integration`.
norecursedirs = integration .* *.egg build dist node_modules venv
