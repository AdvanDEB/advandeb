[pytest]
asyncio_mode = auto
testpaths = tests app/backend/tests knowledge-builder/tests

# Two of the testpaths are directories literally named "tests" with no package
# marker, so the default "prepend" import mode derives the same module name for
# both (tests.test_x) and aborts collection on the collision. importlib imports
# each file by path instead, so basenames no longer have to be unique across
# testpaths. Adding __init__.py does NOT fix this — knowledge-builder/ is not a
# valid package name, so both directories still resolve to "tests".
addopts = --import-mode=importlib
