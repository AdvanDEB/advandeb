[pytest]
# This file makes app/backend its own pytest root, so `cd app/backend && pytest`
# no longer walks up to the repo-root pytest.ini. That file's
# --import-mode=importlib names test modules from the repo root
# (app.backend.tests.test_x), which registers a placeholder `app` module and
# shadows the real `app` package ("'app' is not a package").
#
# The default prepend mode is correct here: tests/ is a package, so pytest puts
# app/backend on sys.path and `import app` resolves to app/backend/app.
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# tests/verify_*.py are manual end-to-end scripts that run against a live
# MongoDB as soon as they are imported. Only test_*.py files are collected.
python_files = test_*.py
