[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advandeb-kb"
version = "0.1.0"
description = "AdvanDEB Knowledge Builder — Python library for knowledge operations"
requires-python = ">=3.11"
dependencies = [
    "motor>=3.3",
    "pydantic>=2.5",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "networkx>=3.2",
    # data_processing_service imports bs4 at module level, and the package
    # __init__ imports that service, so `import advandeb_kb` needs it.
    "beautifulsoup4>=4.12",
]

# Imported lazily, inside the functions that need them.
[project.optional-dependencies]
ingestion = [
    "pypdf>=6.0",
    "redis>=5.0",
]
vector = [
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "python-arango>=7.5",
    "websockets>=12.0",
]
byok = [
    "anthropic>=0.40.0",
    "openai>=1.40.0",
    "google-genai>=2.33",
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.23",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["advandeb_kb*"]

[tool.pytest.ini_options]
# Makes knowledge-builder its own pytest root, so `cd knowledge-builder && pytest`
# does not pick up the repo-root pytest.ini. Only tests/ is collected; the
# manual checks under scripts/ talk to live services and are run by hand.
testpaths = ["tests"]
asyncio_mode = "auto"
