name: CI

on:
  push:
    branches: [main, review-p0]
  pull_request:
    branches: [main, review-p0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python (backend, knowledge-builder, repo tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            knowledge-builder/pyproject.toml

      - name: Install backend deps (includes advandeb_kb, editable)
        id: install
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Each suite is its own pytest root (see the pytest.ini / pyproject
      # next to it). Later suites still run when an earlier one fails, so a
      # red run shows every failure at once.
      - name: Pytest -- app backend
        working-directory: app/backend
        env:
          # Minimum envvars so Settings construct without raising
          JWT_SECRET_KEY: "ci-test-secret-key-at-least-32-chars-long-1234"
          MONGODB_URI: "mongodb://localhost:27017"
          ENVIRONMENT: "development"
        run: pytest -q

      - name: Pytest -- knowledge-builder
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: knowledge-builder
        run: pytest -q

      - name: Pytest -- repo-level tests (tests/integration is not collected)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -q

  frontend:
    name: Frontend (vue-tsc + eslint + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install
        id: install
        run: npm ci

      - name: Typecheck + build
        run: npm run build

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

  mcp:
    name: MCP gateway (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mcp/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mcp/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo clippy
        working-directory: mcp
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: mcp
        run: cargo test --release
